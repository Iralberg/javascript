<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Escreva</h2>
    <main>
        <section id="box-container">
            <div class="box-item" id="box-inicio">
                <label for="inic">Inicio:</label>
                <input type="number" name="" id="inic">
            </div>
            <div class="box-item" id="box-fim">
                <label for="fim">Fim:</label>
                <input type="number" name="" id="fim">
            </div>
            <div class="box-item">
                <label for="passo">Passo:</label>
                <input type="number" name="" id="passo">
            
            </div>
            <button id="btn">Contar</button>
        </section>
        <section>
            <div id="res">
                Resultado:
            </div>
        </section>
    </main>
</body>
</html>
